<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kết quả - Edexis</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --text-light: rgba(255, 255, 255, 0.9);
      --shadow-soft: 0 20px 40px rgba(0, 0, 0, 0.1);
      --shadow-hover: 0 30px 60px rgba(0, 0, 0, 0.15);
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--primary-gradient);
      min-height: 100vh;
      padding: 2rem;
    }
    .navbar {
      backdrop-filter: blur(20px);
      background: var(--glass-bg);
      border-bottom: 1px solid var(--glass-border);
      padding: 1rem 0;
    }
    .results-container {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 3rem;
      box-shadow: var(--shadow-soft);
    }
    .results-container h2 {
      font-weight: 700;
      color: white;
      text-align: center;
      margin-bottom: 2rem;
    }
    .table {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-light);
    }
    .table th, .table td {
      border-color: var(--glass-border);
    }
    .btn-gradient {
      background: var(--secondary-gradient);
      border: none;
      color: white;
      padding: 12px 30px;
      font-weight: 600;
      border-radius: 50px;
      transition: all 0.3s ease;
    }
    .btn-gradient:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }
    #scoreChart {
      max-width: 500px;
      margin: 2rem auto;
    }
    @media (max-width: 576px) {
      .results-container {
        padding: 2rem;
      }
      .results-container h2 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand text-light" href="index.html"><i class="fas fa-graduation-cap me-2"></i>Edexis</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link text-light" href="index.html">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link text-light" href="student_dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link text-light" href="logout">Đăng xuất</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Results Section -->
  <section class="results-container mt-5" data-aos="fade-up">
    <h2><i class="fas fa-chart-bar me-2"></i>Kết quả bài thi</h2>
    <canvas id="scoreChart"></canvas>
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Bài thi</th>
            <th>Điểm</th>
            <th>Nhận xét</th>
            <th>Ngày nộp</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody id="resultList">
          <!-- Lấy động từ API -->
        </tbody>
      </table>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    AOS.init({ duration: 1000, once: true });

    async function loadResults() {
      try {
        const response = await fetch('http://localhost:3000/api/results');
        const results = await response.json();
        const resultList = document.getElementById('resultList');
        resultList.innerHTML = '';
        const scores = [];
        const labels = [];
        results.forEach(r => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${r.exam_title}</td>
            <td>${r.score}</td>
            <td>${r.comments || 'Chưa có'}</td>
            <td>${new Date(r.graded_at).toLocaleDateString()}</td>
            <td><a href="complaints.html" class="btn btn-gradient btn-sm"><i class="fas fa-exclamation-circle me-2"></i>Khiếu nại</a></td>
          `;
          resultList.appendChild(row);
          scores.push(r.score);
          labels.push(r.exam_title);
        });

        // Vẽ biểu đồ
        const ctx = document.getElementById('scoreChart').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: 'Điểm số',
              data: scores,
              backgroundColor: 'rgba(240, 147, 251, 0.5)',
              borderColor: '#f093fb',
              borderWidth: 1
            }]
          },
          options: {
            scales: {
              y: { beginAtZero: true, max: 10 }
            }
          }
        });
      } catch (err) {
        console.error('Lỗi tải kết quả:', err);
      }
    }
    // loadResults(); // Gỡ comment khi có API
  </script>
</body>
</html>
