<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Edexis</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --text-light: rgba(255, 255, 255, 0.9);
      --shadow-soft: 0 20px 40px rgba(0, 0, 0, 0.1);
      --shadow-hover: 0 30px 60px rgba(0, 0, 0, 0.15);
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--primary-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    .login-container {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 3rem;
      max-width: 500px;
      width: 100%;
      box-shadow: var(--shadow-soft);
      position: relative;
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .login-container h2 {
      font-weight: 700;
      color: white;
      text-align: center;
      margin-bottom: 2rem;
    }
    .form-control {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--glass-border);
      color: white;
      font-size: 1rem;
      border-radius: 10px;
      transition: all 0.3s ease;
      padding-right: 45px;
    }
    .form-control:focus {
      background: rgba(255, 255, 255, 0.2);
      border-color: white;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      color: white;
    }
    .form-control::placeholder {
      color: var(--text-light);
      opacity: 0.7;
    }
    .btn-gradient {
      background: var(--secondary-gradient);
      border: none;
      color: white;
      padding: 12px 30px;
      font-weight: 600;
      border-radius: 50px;
      transition: all 0.3s ease;
    }
    .btn-gradient:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }
    .error-message {
      color: #f5576c;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
    .password-wrapper {
      position: relative;
    }
    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--text-light);
      transition: color 0.3s ease;
      z-index: 10;
    }
    .password-toggle:hover {
      color: white;
    }
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1050;
    }
    @media (max-width: 576px) {
      .login-container {
        margin: 1rem;
        padding: 2rem;
      }
      .login-container h2 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="toast-container"></div>
  <div class="login-container" data-aos="zoom-in">
    <h2><i class="fas fa-sign-in-alt me-2"></i>Đăng nhập vào Edexis</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label text-light">Email</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="Nhập email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label text-light">Mật khẩu</label>
        <div class="password-wrapper">
          <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu" required>
          <i class="fas fa-eye password-toggle" id="togglePassword"></i>
        </div>
      </div>
      <div id="errorMessage" class="error-message mb-3"></div>
      <button type="submit" id="submitButton" class="btn btn-gradient w-100">
        <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
      </button>
    </form>
    <p class="text-center text-light mt-3">Chưa có tài khoản? <a href="register.html" class="text-warning">Đăng ký</a></p>
    <p class="text-center text-light"><a href="forgot_password.html" class="text-warning">Quên mật khẩu?</a></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script>
    AOS.init({ duration: 800, once: true });

    // Hiển thị toast
    function showToast(message, type = 'danger') {
      const toastContainer = document.querySelector('.toast-container');
      const toast = document.createElement('div');
      toast.className = `toast align-items-center text-white bg-${type} border-0`;
      toast.role = 'alert';
      toast.innerHTML = `
        <div class="d-flex">
          <div class="toast-body">${message}</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      `;
      toastContainer.appendChild(toast);
      const bsToast = new bootstrap.Toast(toast);
      bsToast.show();
      setTimeout(() => toast.remove(), 3000);
    }

    // Hiện/ẩn mật khẩu
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePassword.classList.toggle('fa-eye');
      togglePassword.classList.toggle('fa-eye-slash');
    });

    // Xử lý submit form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorMessage = document.getElementById('errorMessage');
      const submitButton = document.getElementById('submitButton');

      // Reset trạng thái
      errorMessage.style.display = 'none';
      submitButton.disabled = true;
      submitButton.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Đang xử lý...';

      // Lấy dữ liệu form
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      console.log('Dữ liệu gửi đi:', { email, password }); // Log dữ liệu gửi đi

      // Kiểm tra dữ liệu
      if (!email || !password) {
        showToast('Vui lòng nhập đầy đủ email và mật khẩu!', 'danger');
        submitButton.disabled = false;
        submitButton.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Đăng nhập';
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showToast('Email không hợp lệ!', 'danger');
        submitButton.disabled = false;
        submitButton.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Đăng nhập';
        return;
      }

      if (password.length < 6) {
        showToast('Mật khẩu phải có ít nhất 6 ký tự!', 'danger');
        submitButton.disabled = false;
        submitButton.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Đăng nhập';
        return;
      }

      // Gửi request
      const formData = { email, password };
      try {
        const response = await fetch('http://localhost:3000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        console.log('Phản hồi thô từ server:', await response.clone().text()); 
        const data = await response.json();
        console.log('Dữ liệu JSON:', data); 

        if (!response.ok) {
          showToast(data.message || 'Đăng nhập thất bại!', 'danger');
        } else {
          localStorage.setItem('token', data.token);
          localStorage.setItem('role', data.role); 

          showToast('Đăng nhập thành công!', 'success');

          // Chuyển trang theo role
          setTimeout(() => {
            const role = data.role ? data.role.toLowerCase() : '';
            console.log('Vai trò nhận được:', role); 
            console.log('Token:', data.token); 
            if (role && data.token) {
              switch (role) {
                case 'student':
                  window.location.href = './student_dashboard.html'; 
                  break;
                case 'teacher':
                  window.location.href = './teacher_dashboard.html';
                  break;
                case 'admin':
                  window.location.href = './admin.html';
                  break;
                default:
                  showToast('Vai trò không hợp lệ! Vui lòng liên hệ hỗ trợ.', 'danger');
                  localStorage.removeItem('token');
                  localStorage.removeItem('role');
              }
            } else {
              showToast('Dữ liệu đăng nhập không hợp lệ!', 'danger');
              localStorage.removeItem('token');
              localStorage.removeItem('role');
            }
          }, 1000);
        }
      } catch (err) {
        console.error('Lỗi chi tiết:', err); 
        showToast('Lỗi kết nối server! Vui lòng thử lại.', 'danger');
      } finally {
        submitButton.disabled = false;
        submitButton.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Đăng nhập';
      }
    });
  </script>
</body>
</html>
